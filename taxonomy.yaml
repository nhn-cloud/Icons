# NHN Cloud 아이콘 분류 단일 원천
#
# 팔레트는 main 브랜치(github.com/nhn-cloud/Icons)의 아이콘 유형 체계를 따른다.
#   박스 형태 / 서비스 / 리소스 / 일반  +  Arrows · Extra · Templates
# 사내 배포 라이브러리(NHNCloud-*.xml)와 같은 구성이다.
#
# icons/ 는 서비스 카테고리(compute·network…)로 두고 팔레트와 1:1 로 맞추지 않는다.
# 어느 파일을 쓰는지는 항목의 src 가 정한다(icons/ 기준 경로). 카테고리 아이콘처럼
# 한 파일이 두 팔레트에 들어가는 경우가 있어 디렉터리로는 표현할 수 없다.
#
# Annotations(단계·문제·개선·말풍선 22종)는 저장소에 자산이 없어 비어 있다.
