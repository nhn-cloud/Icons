# NHN Cloud 아이콘 분류 단일 원천
#
# 팔레트는 사내 배포 라이브러리(NHNCloud-*.xml)와 같은 구성·같은 순서다.
#   Box Type · Services · Resources · General · Arrows · Annotations · Extra
# 앞의 넷은 main 브랜치(github.com/nhn-cloud/Icons)의 아이콘 유형 체계다.
# Business 와 Retired 는 이 저장소에만 있는 팔레트라 뒤에 둔다.
# Business 는 영업·사업부서 장표용이라 구성도용 팔레트와 쓰는 사람이 다르다.
# 항목마다 group 을 달아 갤러리에서 쓰임새별 소제목으로 묶는다.
#
# icons/ 는 서비스 카테고리(compute·network…)로 두고 팔레트와 1:1 로 맞추지 않는다.
# 어느 파일을 쓰는지는 항목의 src 가 정한다(icons/ 기준 경로). 카테고리 아이콘처럼
# 한 파일이 두 팔레트에 들어가는 경우가 있어 디렉터리로는 표현할 수 없다.
#
# Annotations 는 아이콘이 아니라 draw.io 도형이라 SVG 에서 만들 수 없다. 배포
# 라이브러리에서 풀어 icons/annotations 에 XML 로 두고 kind: raw 로 다시 압축한다.
# Templates 팔레트(빈 틀·예시 구성도 10종)는 쓰이지 않아 걷어냈다.
