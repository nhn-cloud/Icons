# PPT V2.2 10쪽 "Example / NHN Cloud Groups Blank"
#
# 원본에서 Security Groups 실선 띠는 Availability Zone (A)·(B) 점선 박스 두 개를
# 가로질러 그 안에 걸쳐 그려진다(PPT 실측: AZ y 3.59~4.82 안에 SG y 3.92~4.62).
# over 로 두 AZ 위에 겹쳐 올린다.
title: NHN Cloud Groups Blank
dir: row
items:
  - group: NHN Cloud
    items:
      - group: Organization
        items:
          - group: Project
            items:
              - group: Region
                items:
                  - group: VPC
                    items:
                      - group: Subnet
                        label: Private subnet
                        items:
                          - group: Availability Zone
                            id: aza
                            label: Availability Zone (A)
                          - group: Availability Zone
                            id: azb
                            label: Availability Zone (B)
                          - group: Security Groups
                            over: [aza, azb]
