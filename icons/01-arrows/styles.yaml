# Arrows 팔레트: 이미지가 아니라 draw.io 엣지 스타일로 만듭니다.
#
# 사내 배포 라이브러리 NHNCloud-Arrows.xml 에서 그대로 옮겼습니다 (2026-11-26).
# 4색 x 6변형 = 24종이고, 스타일 문자열도 배포본과 한 글자까지 같습니다.
# 예전 18종(PPT V2.2 16쪽 실측)은 이름과 변형이 달라 더 쓰지 않습니다.
#   Primary Path            -> Primary · 단방향
#   Primary Path · 점선      -> Primary · 단방향 점선
#   Primary Path · 화살촉 없음 -> Primary · 선
#
# ends: forward(끝에만) | both(양쪽) | none(화살촉 없음)
version: 2
arrows:
  # --- Primary (#555555) ---------------------------------------------
  - slug: arr-primary-forward
    name: "Primary · 단방향"
    color: "#555555"
    dashed: 0
    ends: forward
    tags: "nhncloud nhn cloud 엔에이치엔 엔에이치엔클라우드 클라우드 화살표 arrow 연결선 선 connector line 주 경로 주경로 기본"
